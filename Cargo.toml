[package]
name = "bitty-a11y"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "bitty_a11y"
path = "src/lib.rs"

[[bin]]
name = "bitty-a11y"
path = "src/bin/bitty-a11y.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
